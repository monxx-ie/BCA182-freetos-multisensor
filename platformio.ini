[platformio]
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
monitor_speed = 115200

; Link library objects directly so the port's TIM3_IRQHandler
; overrides the weak default handler
lib_archive = no

build_flags =
    -I include
    -I lib/FreeRTOS/include
    -I lib/FreeRTOS/portable/GCC/ARM_CM3

; Static analysis: analyze project code only. unusedFunction is suppressed
; because cppcheck checks files separately and cannot see calls made through
; function pointers (xTaskCreate), the vector table, or HAL/FreeRTOS internals.
; --inline-suppr enables justified in-code suppressions (see dht22.c).
check_tool = cppcheck
check_skip_packages = yes
check_flags = cppcheck: --suppress=unusedFunction --inline-suppr

; Unit tests run on the PC (env:native), not on the STM32
test_ignore = test_logic

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<logic.c>
build_flags = -I include
lib_ignore = FreeRTOS